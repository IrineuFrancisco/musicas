<!DOCTYPE html>
<html>

<head>
  <title>Toca aí</title>
  <style>
    body {
      background-color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }

    .smartphone {
      width: 360px;
      height: 640px;
/*       border-radius: 20px; */
      box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.2);
      overflow: hidden;
      position: relative;
    }

    .tela {
      background-image: url(tela5.jpeg);
      background-size: 100%;
      background-repeat: no-repeat;
      margin-top: 80px;
      padding-left: 10px;
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      padding-top: 50px;
      width: 100%;
      height: calc(100% - 80px);
      background-color: #ffffff;
      top: 80px;
    }

    .barra-superior {
      background-image: url("TocaSENAI.png");
      background-repeat: no-repeat;
      height: 80px;
      width: 100%;
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: rgb(247, 244, 244);
    }
  </style>
  <!-- <link rel="stylesheet" href="style.css"> -->
</head>

<body>

  <div class="smartphone">
    <div class="barra-superior">

    </div>
    <div class="tela">     
      <!-- <h1>Toca aí!</h1> -->     

      <!-- FORMULÁRIO DO FORMSPREE -->
      <form action="https://formspree.io/f/xgvojbkr" method="POST"> 
        <label for="texto" class="texto">Peça sua música!</label><br>
        <input type="text" id="mensagemInput" name="mensagem" placeholder="Digite sua mensagem"
          style="width: 300px;height: 30px;">
        <br>
        <br>
        <label for="email">Seu email:</label><br>
        <input type="email" id="email" name="email" placeholder="Digite seu email"
          style="width: 300px;height: 30px;">
        <br>
        <br>
        <button type="submit">Enviar</button>
      </form>
    </div>  
  </div>

</body>

</html>
